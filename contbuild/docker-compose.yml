services:
  app:
    build:
      context: ..
      dockerfile: contbuild/Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0

    env_file:
      - path: .env
        required: false

    restart: unless-stopped

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant, copiez contbuild/.env.example vers contbuild/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copiez contbuild/.env.example vers contbuild/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant, copiez contbuild/.env.example vers contbuild/.env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  api:
    build:
      context: ../webapp/backend
      dockerfile: ../../contbuild/api.Dockerfile

    ports:
      - "127.0.0.1:3001:3000"

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

volumes:
  db-data:
