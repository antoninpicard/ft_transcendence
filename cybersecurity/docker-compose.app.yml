services:
  app:
    ports: !reset []
    command: ["node", "/vault/vault-exec.js", "npm", "start"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SECRET_PATH: secret/data/app/app
    volumes:
      - ./vault/wrapper/vault-exec.js:/vault/vault-exec.js:ro
      - ./vault/run/app:/run/vault:ro
    networks:
      - default
      - vault-net