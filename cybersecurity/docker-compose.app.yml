services:
  app:
    ports: !reset []
    # The app gets its secrets from Vault only, never from contbuild/.env
    env_file: !reset []
    command: ["node", "/vault/vault-exec.js", "npm", "start"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SECRET_PATH: secret/data/app/app
    volumes:
      - ./vault/wrapper/vault-exec.js:/vault/vault-exec.js:ro
      - ./vault/run/app:/run/vault:ro
    networks:
      - default
      - vault-net

  nginx:
    # In the integrated stack, the WAF protects the real app (not the whoami test backend)
    environment:
      BACKEND: http://app:3000
    volumes:
      # Adds the /api and /ws routes to the API (see the file)
      - ./waf/nginx/location_common.conf.template:/etc/nginx/templates/includes/location_common.conf.template:ro
    depends_on:
      - app

  api:
    # Paths are relative to cybersecurity/ (directory of the first Compose file)
    env_file: !override
      - path: ../contbuild/.env
        required: false
    # Same start command as contbuild/api.Dockerfile, run through vault-exec.js: it logs in
    # with the backend AppRole, reads secret/backend/app and adds it to the environment
    # (Vault values win over contbuild/.env)
    command: ["node", "/vault/vault-exec.js", "sh", "-c", "node src/db/migrate.js && exec node src/server.js"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_SECRET_PATH: secret/data/backend/app
      # These secrets come from Vault only: emptied here so that a value written in
      # contbuild/.env never reaches the container (docker inspect); vault-exec.js then
      # sets them from secret/backend/app
      DEVICE_TOKEN: ""
      BADGE_UID_SECRET: ""
      FORTYTWO_CLIENT_SECRET: ""
    volumes:
      - ./vault/wrapper/vault-exec.js:/vault/vault-exec.js:ro
      - ./vault/run/backend:/run/vault:ro
    networks:
      - default
      - vault-net
