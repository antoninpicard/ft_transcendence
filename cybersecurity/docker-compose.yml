services:
  nginx:
    image: owasp/modsecurity-crs:4.25-nginx-lts
    ports:
      - "8443:8443"
    volumes:
      - ./waf/certs:/etc/nginx/certs:ro
    environment:
      - BACKEND=http://whoami:80
      - SERVER_NAME=localhost
      - SSL_CERT_FILE=/etc/nginx/certs/server.crt
      - SSL_CERT_KEY_FILE=/etc/nginx/certs/server.key
      - MODSEC_RULE_ENGINE=On
      - BLOCKING_PARANOIA=2
      - ALLOWED_METHODS=GET HEAD POST PUT PATCH DELETE OPTIONS
    depends_on:
      - whoami

  whoami:
    image: traefik/whoami