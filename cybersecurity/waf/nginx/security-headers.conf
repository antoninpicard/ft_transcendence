# Security headers added by the WAF to EVERY response (http context).
# more_set_headers (headers-more module) replaces the header if the backend already sends it.

# Forbids the browser from "guessing" the type of a file (e.g. running a .txt as JS).
more_set_headers "X-Content-Type-Options: nosniff";
# Forbids embedding the site in an iframe (clickjacking).
more_set_headers "X-Frame-Options: DENY";
# Does not send the full URL to other sites.
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
# Disables sensitive browser APIs the site does not use.
more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()";
