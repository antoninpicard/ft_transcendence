# Project rules, loaded BEFORE the OWASP CRS (the files in rules/ are
# included in alphabetical order: REQUEST-900 comes first).
# IDs 10000-19999 are reserved for local rules (the CRS uses 900000+).

# --- Rule 10001: no Vault token from the outside ------------------------
# Only the backend, on the internal network, talks to Vault. A request
# arriving from the Internet with an X-Vault-Token header is an attack
# attempt (or a leak): block it immediately with 403.
SecRule &REQUEST_HEADERS:X-Vault-Token "@gt 0" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,\
    msg:'X-Vault-Token header received from outside',\
    tag:'project/vault'"

# Note on the ESP32 badge reader: it calls https://<IP>/api/scan, so its "Host"
# header is a numeric IP -> CRS rule 920350 (+3 points). Its missing "Accept"
# header (rule 920300) is only paranoia level 3: logged, not counted.
# 3 < 5 (threshold): it gets through with NO exception. If BLOCKING_PARANOIA goes up to 3,
# add an exclusion here for /api/scan and /api/hello.
