# Exclusions loaded AFTER the OWASP CRS (to fix false positives).
#
# Method when a legitimate request is blocked (403):
#   1. docker compose logs waf | grep '"id"'   -> find the rule id
#   2. exclude it as NARROWLY as possible: one rule, one parameter,
#      never a whole category. Examples:
#
#   SecRuleUpdateTargetById 942100 "!ARGS:json.bio"
#       -> rule 942100 (SQLi) no longer inspects the "bio" field of the JSON
#
#   SecRuleRemoveById 920420
#       -> removes the rule completely (last resort, explain why)
#
# No exclusions needed yet: everything goes through the CRS at paranoia level 2.
