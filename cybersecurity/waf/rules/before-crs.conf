# Règle locale (id 10001) : bloque l'accès aux fichiers sensibles (.env, .git)
SecRule REQUEST_URI "@rx (?i)/\.(env|git)(\.|/|\?|$)" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Sensitive file access blocked'"

# Exclusion ciblée (id 10010) : POST /api/messages/<uuid>, champ JSON "body" uniquement.
# Un message est du texte libre : « select … from », « -- », « 1 OR 2 » y sont normaux,
# mais déclenchent ces règles SQL de paranoïa 2 (faux positifs testés le 25/11/2026).
# On les retire de ce seul champ. Restent actives sur lui : toutes les règles de niveau 1
# (dont 942100, libinjection) et toutes les règles XSS ; les autres champs et routes gardent
# la paranoïa 2 complète. Une vraie injection SQL ou un <script> restent bloqués (testé).
SecRule REQUEST_METHOD "@streq POST" \
    "id:10010,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/messages/[0-9a-fA-F-]{36}$" \
        "ctl:ruleRemoveTargetById=942180;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942200;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942260;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942300;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942390;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942440;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942480;ARGS:json.body,\
        ctl:ruleRemoveTargetById=942520;ARGS:json.body"