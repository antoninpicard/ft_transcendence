<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#fff8e9">
		<title>CLB Private Club</title>
		<script>
			// Apply the saved theme before the first paint, so a dark theme does not flash light
			// (src/theme.js does the same once the app runs, and keeps it in sync with the account)
			try {
				var theme = localStorage.getItem("clb-theme") || "auto";
				if (theme === "auto")
					theme = matchMedia("(prefers-color-scheme: dark)").matches ? "chocolat" : "biscuit";
				document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
